{% extends 'base.html' %}
{% block title %}주문하기{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:700px">
  <h2 class="fw-bold mb-4">주문하기</h2>
  <div class="row g-4">
    <div class="col-md-7">
      <div class="card border-0 shadow-sm rounded-4 p-4 mb-3">
        <h5 class="fw-bold mb-3">배송 정보</h5>
        <form action="{{ url_for('user.checkout') }}" method="POST" id="order-form">
          <div class="mb-3">
            <label class="form-label">받는 사람</label>
            <input type="text" class="form-control" value="{{ current_user.username }}" readonly>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">배송 주소 <span class="text-danger">*</span></label>
            <input type="text" name="address" class="form-control" placeholder="주소를 입력해주세요" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-bold btn-lg">결제 완료</button>
        </form>
      </div>
    </div>
    <div class="col-md-5">
      <div class="card border-0 shadow-sm rounded-4 p-4">
        <h5 class="fw-bold mb-3">주문 상품</h5>
        {% for item in items %}
        <div class="d-flex justify-content-between mb-2">
          <span class="text-muted small">{{ item.product.name }} x{{ item.quantity }}</span>
          <span class="small fw-semibold">{{ "{:,}".format(item.product.price * item.quantity) }}원</span>
        </div>
        {% endfor %}
        <hr>
        <div class="d-flex justify-content-between fw-bold fs-5">
          <span>합계</span>
          <span class="text-primary">{{ "{:,}".format(total) }}원</span>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
