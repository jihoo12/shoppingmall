{% extends 'base.html' %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="container" style="max-width:440px; padding-top:80px; padding-bottom:80px">
  <div class="card shadow-lg border-0 rounded-4">
    <div class="card-body p-5">
      <h2 class="fw-bold text-center mb-1">로그인</h2>
      <p class="text-center text-muted mb-4">ShopFlask에 오신걸 환영합니다</p>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">이메일</label>
          <input type="email" name="email" class="form-control form-control-lg" placeholder="example@email.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">비밀번호</label>
          <input type="password" name="password" class="form-control form-control-lg" placeholder="비밀번호 입력" required>
        </div>
        <div class="mb-4 d-flex justify-content-between align-items-center">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="remember" id="remember">
            <label class="form-check-label text-muted" for="remember">로그인 유지</label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold">로그인</button>
      </form>
      <hr class="my-4">
      <p class="text-center mb-0 text-muted">계정이 없으신가요?
        <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-semibold" style="color:var(--primary)">회원가입</a>
      </p>
    </div>
  </div>
  <p class="text-center text-muted mt-3 small">
    테스트 관리자: admin@shop.com / admin1234
  </p>
</div>
{% endblock %}
