{% extends 'admin/base_admin.html' %}
{% block title %}카테고리 관리{% endblock %}
{% block page_title %}카테고리 관리{% endblock %}
{% block content %}
<div class="row g-4">
  <div class="col-md-5">
    <div class="card p-4">
      <h6 class="fw-bold mb-3">카테고리 추가</h6>
      <form method="POST" class="d-flex gap-2">
        <input type="text" name="name" class="form-control" placeholder="카테고리명 입력" required>
        <button type="submit" class="btn btn-primary px-3">추가</button>
      </form>
    </div>
  </div>
  <div class="col-md-7">
    <div class="card">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead class="table-light"><tr><th>카테고리명</th><th>상품수</th><th>삭제</th></tr></thead>
          <tbody>
          {% for cat in categories %}
          <tr>
            <td><strong>{{ cat.name }}</strong></td>
            <td><span class="badge bg-light text-dark">{{ cat.products|length }}개</span></td>
            <td>
              <form action="{{ url_for('admin.delete_category', cat_id=cat.id) }}" method="POST" onsubmit="return confirm('삭제할까요?')">
                <button class="btn btn-sm btn-outline-danger">삭제</button>
              </form>
            </td>
          </tr>
          {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
